[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-it"
version = "0.1.0"
description = "Split shared expenses and settle up with the fewest payments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Rafique" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
split-it = "splitit.cli:main"

[tool.setuptools]
packages = ["splitit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
